upgrade(s){if(this.tech[s]||this.cash[s]<300||!this.buildings.some(b=>b.side===s&&b.type==='lab'&&b.hp>0)||this.winner!==null)return false;this.cash[s]-=300;this.tech[s]=1;return true;}
spawn(s,k,b){let used=new Set(this.units.filter(u=>!u.dead).flatMap(u=>[u.p,u.q]));let p=-1,best=Infinity;for(let i=0;i<this.C;i++){if(used.has(i)||!this.adj[i].includes(i))continue;let d=(i%120*10+5-b.x)**2+((i/120|0)*10+5-b.y)**2;if(d<best){best=d;p=i}}if(p<0)return false;let goal=p,d=new Int16Array(this.C).fill(30000),q=[goal];d[goal]=0;for(let i=0;i<q.length;i++)for(let j of this.adj[q[i]])if(d[j]===30000){d[j]=d[q[i]]+1;q.push(j)}let u={id:this.units.length,side:s,kind:k,hp:C19.TYPES[k][1],cd:0,ammo:12,dead:false,p,q:p,goal,dist:d,age:0,x:p%120*10+5,y:(p/120|0)*10+5,a:0};this.units.push(u);this.groups[s].push(u);this.add(u);return true;}

}

let a,run=false;const $=id=>document.getElementById(id),c=$('c'),g=c.getContext('2d');let start=null;const colors=['#65d4b0','#e5a06b'];function draw(){g.clearRect(0,0,1200,800);g.fillStyle='#52626a';for(const o of a.obstacles)g.fillRect(o.x,o.y,o.w,o.h);for(const u of a.units){if(u.dead||u.side&&u.visible&&!u.visible[0])continue;g.save();g.translate(u.x,u.y);g.rotate(u.a);g.fillStyle=colors[u.side];if(TYPES[u.kind][5]==='air'){g.beginPath();g.moveTo(6,0);g.lineTo(-4,-5);g.lineTo(-4,5);g.closePath();g.fill()}else g.fillRect(-4,-3,8,6);g.fillStyle='#18272b';g.fillRect(-1,-1,5,2);g.restore();g.fillStyle=colors[u.side];g.fillRect(u.x-4,u.y-6,8*u.hp/TYPES[u.kind][1],1.5);if(a.selected.has(u.id)){g.strokeStyle='white';g.strokeRect(u.x-6,u.y-6,12,12)}}for(const e of a.effects){g.strokeStyle=e.repair?'#68ff96':'#ffdb82';g.beginPath();g.moveTo(e.x,e.y);g.lineTo(e.tx,e.ty);g.stroke()}for(const b of a.buildings){if(b.hp<=0)continue;g.fillStyle=colors[b.side];g.fillRect(b.x-17,b.y-17,34,34);g.fillStyle='#10242b';g.fillRect(b.x-13,b.y-13,26,26);g.fillStyle='white';g.font='11px sans-serif';g.fillText(({hq:'HQ',mine:'矿',barracks:'兵',factory:'车',airfield:'空',lab:'科'})[b.type],b.x-9,b.y+4);g.fillStyle=colors[b.side];g.fillRect(b.x-17,b.y-22,34*b.hp/b.max,3)}$('economy').textContent='资源 '+Math.floor(a.cash[0])+' | 科技 '+a.tech[0]+' | 生产队列 '+a.queue.filter(q=>q.side===0).length+' | '+(a.winner===null?'交战中':a.winner===0?'胜利':a.winner===1?'失败':'平局');$('stats').textContent=JSON.stringify({time:a.t.toFixed(1),alive:[0,1].map(s=>a.units.filter(u=>u.side===s&&!u.dead).length),kills:a.kills,selected:a.selected.size,overlaps:a.audit().overlaps},null,2)}function reset(){run=false;a=new Strategy();run=true;draw()}$('reset').onclick=reset;$('play').onclick=()=>run=!run;$('step').onclick=()=>{a.step();draw()};function point(e){let r=c.getBoundingClientRect();return [(e.clientX-r.left)*1200/r.width,(e.clientY-r.top)*800/r.height]}c.onpointerdown=e=>{if(e.button===0)start=point(e)};c.onpointerup=e=
